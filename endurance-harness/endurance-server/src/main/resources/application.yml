spring:
  application:
    name: endurance-harness
  profiles:
    default: bootstrap
  autoconfigure:
    # 所有环境默认不创建数据库连接，由显式基础设施配置按开关提供 DataSource。
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisReactiveAutoConfiguration
  flyway:
    enabled: ${endurance.postgres.enabled}
    locations: classpath:db/migration
    schemas: ${endurance.postgres.schema}
    default-schema: ${endurance.postgres.schema}
    clean-disabled: true
    baseline-on-migrate: false
    fail-on-missing-locations: true
  data:
    redis:
      repositories:
        enabled: false
  jackson:
    datatype:
      datetime:
        WRITE_DATES_AS_TIMESTAMPS: false
        WRITE_DURATIONS_AS_TIMESTAMPS: false
  lifecycle:
    timeout-per-shutdown-phase: ${ENDURANCE_SHUTDOWN_SECONDS:5}s
  threads:
    virtual:
      enabled: true
server:
  shutdown: graceful
  port: ${ENDURANCE_PORT:8080}
logging:
  file:
    path: ${ENDURANCE_LOG_PATH:logs}
management:
  tracing:
    sampling:
      probability: ${ENDURANCE_TRACE_SAMPLING:1.0}
    export:
      otlp:
        enabled: ${ENDURANCE_OTLP_TRACES_ENABLED:false}
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://127.0.0.1:4318/v1/traces}
  otlp:
    metrics:
      export:
        enabled: ${ENDURANCE_OTLP_METRICS_ENABLED:false}
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://127.0.0.1:4318/v1/metrics}
  logging:
    export:
      otlp:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never
endurance:
  service:
    name: Endurance Harness
    version: "@project.version@"
    stage: foundation
  security:
    enabled: ${ENDURANCE_AUTH_ENABLED:false}
    bearer-token: ${ENDURANCE_API_TOKEN:}
    allowed-origins: []
  executors:
    shutdown-seconds: ${ENDURANCE_SHUTDOWN_SECONDS:5}
    task-timeout-seconds: 30
    io:
      core-size: 4
      max-size: 16
      queue-capacity: 256
      keep-alive-seconds: 60
    cpu:
      core-size: 2
      max-size: 4
      queue-capacity: 64
      keep-alive-seconds: 60
  postgres:
    enabled: ${ENDURANCE_POSTGRES_ENABLED:false}
    url: ${ENDURANCE_DB_URL:}
    username: ${ENDURANCE_DB_USERNAME:}
    password: ${ENDURANCE_DB_PASSWORD:}
    schema: ${ENDURANCE_DB_SCHEMA:endurance}
    max-pool-size: 10
    minimum-idle: 1
    connection-timeout-ms: 3000
    max-page-size: 200
  redis:
    enabled: ${ENDURANCE_REDIS_ENABLED:false}
    host: ${ENDURANCE_REDIS_HOST:127.0.0.1}
    port: ${ENDURANCE_REDIS_PORT:6379}
    database: ${ENDURANCE_REDIS_DATABASE:0}
    username: ${ENDURANCE_REDIS_USERNAME:}
    password: ${ENDURANCE_REDIS_PASSWORD:}
    timeout-ms: 3000
    ssl: ${ENDURANCE_REDIS_SSL:false}
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
