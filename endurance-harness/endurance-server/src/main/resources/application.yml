spring:
  application:
    name: endurance-harness
  profiles:
    default: bootstrap
  autoconfigure:
    # 所有环境默认不创建数据库连接，由显式基础设施配置按开关提供 DataSource。
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
  jackson:
    datatype:
      datetime:
        WRITE_DATES_AS_TIMESTAMPS: false
        WRITE_DURATIONS_AS_TIMESTAMPS: false
  threads:
    virtual:
      enabled: true
server:
  port: ${ENDURANCE_PORT:8080}
logging:
  file:
    path: ${ENDURANCE_LOG_PATH:logs}
management:
  tracing:
    sampling:
      probability: ${ENDURANCE_TRACE_SAMPLING:1.0}
    export:
      otlp:
        enabled: ${ENDURANCE_OTLP_TRACES_ENABLED:false}
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://127.0.0.1:4318/v1/traces}
  otlp:
    metrics:
      export:
        enabled: ${ENDURANCE_OTLP_METRICS_ENABLED:false}
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://127.0.0.1:4318/v1/metrics}
  logging:
    export:
      otlp:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
endurance:
  service:
    name: Endurance Harness
    version: "@project.version@"
    stage: foundation
