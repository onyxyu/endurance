<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Endurance Harness</title>
    <style>
      :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #183733; background: #f4f7f5; }
      body { margin: 0; padding: 12vh 24px; }
      main { max-width: 720px; margin: auto; }
      .tag { display: inline-block; border: 1px solid #a9c3b9; border-radius: 30px; padding: 6px 12px; }
      h1 { font-size: clamp(2rem, 6vw, 3.5rem); letter-spacing: -.04em; margin-bottom: 16px; }
      p { line-height: 1.8; color: #536a63; }
      nav { display: flex; flex-wrap: wrap; gap: 16px; margin: 30px 0; }
      a { color: inherit; text-underline-offset: 5px; }
      code { padding: 3px 6px; background: #e5ede8; border-radius: 5px; }
      @media(prefers-color-scheme: dark) { :root { color: #d9eee3; background: #13231f; } p { color: #a5beb3; } code { background: #263b32; } }
    </style>
  </head>
  <body>
    <main>
      <span class="tag">基础工程 · Bootstrap</span>
      <h1>Endurance Harness</h1>
      <p>个人自用的云端 Agent 运行时。</p>
      <p>当前提供 Java 多模块工程、服务入口和连接检查。Agent Loop、模型调用、数据库持久化与沙箱执行将按模块逐步接入。</p>
      <nav aria-label="服务检查">
        <a href="/api/system/info">查看工程信息</a>
        <a href="/actuator/health">查看服务健康状态</a>
      </nav>
      <p>聊天入口：<code>endurance-web</code>；管理界面：<code>endurance-admin</code>。</p>
    </main>
  </body>
</html>
